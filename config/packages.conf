# Package Lists for Fedora Bootstrap
# Sourced by bootstrap.sh to define packages to install

# Core utilities and CLI tools
DNF_BASE=(
  bash-completion curl git jq moreutils neovim tmux wget zsh
)

# Development tools (in addition to development-tools group)
DNF_DEV=(
  ansible awscli2 helm uv PackageKit-command-not-found
)

# Modern CLI replacements and productivity tools
DNF_MODERN=(
  awk bat btop duf eza fastfetch fd-find fzf glow gum k9s onefetch ripgrep
  swaks tealdeer tree-sitter-cli yq zoxide
)

# File compression and archiving
DNF_ARCHIVE=(
  # Fedora unrar wraps unrar-free.
  detox ncompress p7zip p7zip-plugins unrar
)

# Version control and file managers
DNF_VCS=(
  helix lazygit
)

# System utilities
DNF_UTILS=(
  dnf-utils
)

# All DNF packages combined (for easy bulk install)
DNF_ALL=(
  "${DNF_BASE[@]}"
  "${DNF_DEV[@]}"
  "${DNF_MODERN[@]}"
  "${DNF_ARCHIVE[@]}"
  "${DNF_VCS[@]}"
  "${DNF_UTILS[@]}"
)


# Tools supplied by Terra
DNF_TERRA=(
  starship yazi ouch
)
